# Copy to config.yaml and list the repositories to track.

# --- GitHub (github.com) -----------------------------------------------------
# Each entry is "owner/repo". You need read access to each with your token.
repos:
  - octocat/Hello-World

# --- Google Cloud Source Repositories ---------------------------------------
# CSR has no REST API for branches or commit history, so these are read from a
# local bare mirror clone that is fetched on each refresh. Requires `gcloud`
# on PATH and a one-time `gcloud auth login`.
gcloud:
  # Default project for bare repo names below.
  project: my-gcp-project
  repos:
    - my-repo
    # Or name the project explicitly per repo:
    # - project: other-project
    #   repo: services/api
    # A pasted clone URL also works:
    # - https://source.developers.google.com/p/my-gcp-project/r/my-repo

# --- Shared settings --------------------------------------------------------
# Defaults applied when the UI does not override them.
defaults:
  # How far back to look for commits.
  days: 14
  # Max commits fetched per branch (one API page for GitHub).
  commits_per_branch: 30

# Folder-level (per-microservice) tracking: attributes each commit to the
# folder(s) whose files it changed.
folders:
  # Turn off to skip file-list lookups entirely (see cost note below).
  enabled: true
  # How many leading path segments name a service. 1 => top-level folder, so
  # "auth/main.py" -> "auth". Use 2 for a "services/auth/..." layout, or better,
  # use `paths` below.
  depth: 1
  # Optional globs for when services sit under a shared prefix. With
  # "services/*", the path "services/auth/main.py" is attributed to
  # "services/auth" instead of the useless shared parent "services".
  # Paths matching no glob fall back to `depth`.
  paths: []
  #  - services/*
  #  - apps/*
  #  - packages/*
  # Folders that aren't services. Matches a whole folder or any of its segments,
  # so "__pycache__" also drops "api/__pycache__".
  exclude:
    - __pycache__
    - node_modules
    - .github
    - .venv

# Folder-tracking cost: GitHub's list-commits endpoint carries no file list, so
# this needs one extra API call per commit. Those results are immutable and are
# cached permanently in .cache/commit-files.sqlite3, so it is a one-time cost per
# commit, not per refresh. CSR pays nothing — git log returns files for free.

# Cost note: GitHub costs roughly (2 + branch count) API calls per repo per
# refresh; authenticated github.com allows 5000/hour and responses are cached
# for CACHE_TTL_SECONDS. CSR costs one `git fetch` per repo per refresh
# regardless of branch count, and skips branches with no recent commits.

# Optional: only show branches matching these glob patterns (empty = all branches).
# Applies to both providers. Example: ["main", "release/*", "feature/*"]
branch_include: []

# Optional: always hide branches matching these glob patterns.
branch_exclude:
  - dependabot/*

# ---------------------------------------------------------------------------
# Who is using the app, and what they may do (the Migrations tab).
#
# Three ways to run this. A (dev mode) and C (proxy headers) are MUTUALLY
# EXCLUSIVE: setting `trusted_proxies` switches `dev_mode` off, because a proxy
# on the same host also looks like loopback and would otherwise let dev mode be
# reached through it. B (built-in SSO) is the one to use for a real deployment.
# ---------------------------------------------------------------------------

# --- OPTION A: testing, no SSO ---------------------------------------------
# The caller declares who they are and the tab shows a role switcher, so one
# person can walk a request through the whole workflow. This is a COMPLETE
# authentication bypass: it is refused from anywhere but loopback unless
# dev_allow_remote is set, the server warns on every start, and the tab carries
# a standing amber banner. Do not deploy with it on.
#
# auth:
#   dev_mode: true
#   dev_allow_remote: false     # true to allow it from other machines too
#   dev_user: you@example.com   # who you are before picking someone else
#   roles:
#     developer: ["*@example.com"]
#     approver:  [you@example.com]
#     devops:    [you@example.com]
#     admin:     [you@example.com]   # superset; can also retire and delete records

# --- OPTION B: deployed, with built-in single sign-on ----------------------
# The app does the OpenID Connect flow itself — no proxy needed. Point it at
# Google Workspace, Microsoft Entra ID (Azure AD), or any OIDC provider, and
# register the redirect_url below with that provider as a permitted redirect.
#
# Secrets belong in .env, not here: SSO_CLIENT_ID, SSO_CLIENT_SECRET and
# SESSION_SECRET all override what is written in this file.
#
# auth:
#   session_secret: ""                 # or SESSION_SECRET in .env; random if unset
#   sso:
#     # Google Cloud console → Credentials → OAuth client ID → Web application.
#     # Add redirect_url below to "Authorised redirect URIs" exactly as written.
#     provider: google                 # google | azure | oidc
#     client_id: "...apps.googleusercontent.com"
#     client_secret: "..."
#     redirect_url: https://dashboard.example.com/auth/callback
#     allowed_domains: [tcs.com]       # refuse anyone outside these
#     hosted_domain: tcs.com           # google only: pre-filter the chooser
#     session_hours: 12
#   roles:
#     developer: ["*@tcs.com"]
#     approver:  [lead@tcs.com]
#
# For Microsoft Entra ID instead:
#
# auth:
#   sso:
#     provider: azure
#     tenant: 00000000-0000-0000-0000-000000000000   # or "organizations"
#     client_id: "..."
#     client_secret: "..."
#     redirect_url: https://dashboard.example.com/auth/callback
#     # Optional: take roles from the token as well as from the address.
#     role_claim: roles
#     role_map:
#       MigrationApprover: approver
#       MigrationDevOps: devops

# --- OPTION C: deployed, behind an SSO proxy -------------------------------
# Identity comes from a header the proxy sets. This is only safe if the app
# CANNOT be reached except through that proxy — a header is just bytes the
# client sends, so anyone able to connect directly can claim to be anybody.
# `trusted_proxies` is the guard; leave it out and the app still runs but warns
# on every page that it is unprotected.
#
# auth:
#   header: X-Forwarded-Email   # X-Forwarded-User and X-Auth-Request-Email also read
#   trusted_proxies:            # honour that header only from these addresses
#     - 127.0.0.1
#     - 10.0.0.0/8
#   roles:                      # exact addresses or globs; matching ignores case
#     developer:
#       - "*@example.com"
#     approver:
#       - lead@example.com
#     devops:
#       - devops@example.com
#     # A superset: satisfies every other role's checks. Approvers and admins
#     # are the ones who can deactivate or delete records.
#     admin:
#       - lead@example.com

