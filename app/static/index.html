<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Declared before the stylesheet loads so a dark-themed OS cannot flash a
       dark canvas or paint native controls dark on first render. -->
  <meta name="color-scheme" content="light" />
  <title>Repo Change Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Repo Change Dashboard</h1>
    </div>
    <div class="topbar-controls">
      <label class="field">
        <span>Window</span>
        <select id="days">
          <option value="1">24 hours</option>
          <option value="3">3 days</option>
          <option value="7">7 days</option>
          <option value="14">14 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
        </select>
      </label>
      <button id="refresh" class="btn primary">Refresh</button>
      <span id="rate" class="rate" title="GitHub API requests remaining this hour"></span>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel" id="provider-panel">
        <h2>Source</h2>
        <div id="provider-filters" class="optlist" role="listbox" aria-label="Source"></div>
      </section>

      <section class="panel">
        <h2>Repository</h2>
        <div id="repo-filters" class="optlist scroll" role="listbox" aria-label="Repository"></div>
      </section>

      <section class="panel">
        <h2>Branch</h2>
        <p id="branch-scope" class="scope-note"></p>
        <input id="branch-search" class="input" type="search" placeholder="Filter branches…" />
        <div id="branch-filters" class="optlist scroll" role="listbox" aria-label="Branch"></div>
      </section>

      <section class="panel" id="folder-panel">
        <h2>Service / folder</h2>
        <p id="folder-scope" class="scope-note"></p>
        <input id="folder-search" class="input" type="search" placeholder="Filter folders…" />
        <div id="folder-filters" class="optlist scroll" role="listbox" aria-label="Service or folder"></div>
      </section>

      <section class="panel">
        <h2>Author</h2>
        <div id="author-filters" class="optlist scroll" role="listbox" aria-label="Author"></div>
      </section>

      <section class="panel">
        <h2>Options</h2>
        <label class="field block">
          <span>Show</span>
          <select id="scope-commits">
            <option value="all">All commits</option>
            <option value="off-default">Only commits not on the default branch</option>
            <option value="reverts">Only reverts</option>
            <option value="churn">Only rapid re-touches (same folder, 24h)</option>
          </select>
        </label>
        <label class="field block">
          <span>Group feed by</span>
          <select id="group-by">
            <option value="day">Day</option>
            <option value="repo">Repository</option>
            <option value="folder">Service / folder</option>
          </select>
        </label>
        <button id="reset" class="btn ghost">Reset selection</button>
      </section>
    </aside>

    <section class="content">
      <div id="stats" class="stats"></div>
      <div class="feed-head">
        <input id="search" class="input grow" type="search" placeholder="Search commit message, author, or SHA…" />
        <span id="result-count" class="muted"></span>
      </div>
      <div id="feed" class="feed">
        <div class="state"><p class="state-title">Loading…</p><p class="state-hint">Reading commits from the configured repositories.</p></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
