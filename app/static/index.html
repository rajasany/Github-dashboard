<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Declared before the stylesheet loads so a dark-themed OS cannot flash a
       dark canvas or paint native controls dark on first render. -->
  <meta name="color-scheme" content="light" />
  <title>Repo Change Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Repo Change Dashboard</h1>
    </div>
    <div class="topbar-controls">
      <div class="daterange" role="group" aria-label="Date range">
        <label class="field">
          <span>Period</span>
          <select id="preset">
            <option value="1">Last 24 hours</option>
            <option value="7">Last 7 days</option>
            <option value="14">Last 14 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="365">Last 12 months</option>
            <option value="mtd">This month</option>
            <option value="custom">Custom…</option>
          </select>
        </label>
        <label class="field">
          <span>From</span>
          <input type="date" id="date-from" aria-label="Commits on or after this date" />
        </label>
        <label class="field">
          <span>To</span>
          <input type="date" id="date-to" placeholder="today" aria-label="Commits up to and including this date" />
        </label>
        <button id="date-clear" class="btn tiny" title="Clear the end date to run through to today">To&nbsp;today</button>
      </div>
      <button id="refresh" class="btn primary">Refresh</button>
      <span id="rate" class="rate" title="GitHub API requests remaining this hour"></span>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel" id="provider-panel">
        <h2>Source</h2>
        <div id="provider-filters" class="optlist" role="listbox" aria-label="Source"></div>
      </section>

      <section class="panel">
        <h2>Repository</h2>
        <div id="repo-filters" class="optlist scroll" role="listbox" aria-label="Repository"></div>
      </section>

      <section class="panel">
        <h2>Branch</h2>
        <p id="branch-scope" class="scope-note"></p>
        <input id="branch-search" class="input" type="search" placeholder="Filter branches…" />
        <div id="branch-filters" class="optlist scroll" role="listbox" aria-label="Branch"></div>
      </section>

      <section class="panel" id="folder-panel">
        <h2>Service / folder</h2>
        <p id="folder-scope" class="scope-note"></p>
        <input id="folder-search" class="input" type="search" placeholder="Filter folders…" />
        <div id="folder-filters" class="optlist scroll" role="listbox" aria-label="Service or folder"></div>
      </section>

      <section class="panel" id="compare-panel">
        <h2>Compare branches</h2>
        <p id="compare-scope" class="scope-note"></p>
        <div class="compare-controls">
          <label class="field block">
            <span>Base (what you have)</span>
            <select id="compare-base"></select>
          </label>
          <label class="field block">
            <span>Head (what to bring in)</span>
            <select id="compare-head"></select>
          </label>
          <button id="compare-run" class="btn primary compare-go">Compare</button>
          <button id="compare-swap" class="btn tiny compare-swap" title="Swap base and head">⇅ Swap direction</button>
        </div>
      </section>

      <section class="panel">
        <h2>Author</h2>
        <div id="author-filters" class="optlist scroll" role="listbox" aria-label="Author"></div>
      </section>

      <section class="panel">
        <h2>Options</h2>
        <label class="field block">
          <span>Show</span>
          <select id="scope-commits">
            <option value="all">All commits</option>
            <option value="off-default">Only commits not on the default branch</option>
            <option value="reverts">Only reverts</option>
            <option value="churn">Only rapid re-touches (same folder, 24h)</option>
          </select>
        </label>
        <label class="field block">
          <span>Group feed by</span>
          <select id="group-by">
            <option value="day">Day</option>
            <option value="repo">Repository</option>
            <option value="folder">Service / folder</option>
          </select>
        </label>
        <button id="reset" class="btn ghost">Reset selection</button>
      </section>
    </aside>

    <section class="content">
      <div id="compare-view" class="compare-view hidden">
        <div class="compare-head">
          <div class="compare-title">
            <h2 id="compare-heading"></h2>
            <p id="compare-sub" class="muted"></p>
          </div>
          <div class="compare-actions">
            <span id="compare-status" class="status-badge"></span>
            <span class="export-label">Report</span>
            <button id="compare-export-pdf" class="btn tiny" title="Download a PDF of this comparison">PDF</button>
            <button id="compare-export-pptx" class="btn tiny" title="Download PowerPoint slides of this comparison">Slides</button>
            <a id="compare-link" class="btn tiny" target="_blank" rel="noopener">Open on host</a>
            <button id="compare-exit" class="btn tiny">Back to feed</button>
          </div>
        </div>
        <div id="compare-stats" class="stats"></div>
        <div id="compare-body"></div>
      </div>

      <div id="feed-view">
      <div id="stats" class="stats"></div>
      <div class="feed-head">
        <input id="search" class="input grow" type="search" placeholder="Search commit message, author, or SHA…" />
        <span id="result-count" class="muted"></span>
        <div class="export" role="group" aria-label="Export report">
          <span class="export-label">Report</span>
          <button id="export-pdf" class="btn tiny" title="Download a PDF of exactly what is on screen">PDF</button>
          <button id="export-pptx" class="btn tiny" title="Download PowerPoint slides of exactly what is on screen">Slides</button>
        </div>
      </div>
      <p id="scope-line" class="scope-line"></p>
      <div id="feed" class="feed">
        <div class="state"><p class="state-title">Loading…</p><p class="state-hint">Reading commits from the configured repositories.</p></div>
      </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
